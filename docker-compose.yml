services:
  worker:
    build: .
    # Without this, compose tries Docker Hub first and every `up` starts with
    # a failed pull.
    pull_policy: build
    restart: unless-stopped
    # Three replicas so the proxy hands each its own session id and thus its
    # own exit IP. Deliberately NO MEERKLY_WORKER_ID and NO volume: identity
    # then derives from MEERKLY_API_KEY + each container's unique hostname
    # (config.py falls back to socket.gethostname()), giving three distinct,
    # gateway-valid machine ids. A shared volume or a shared worker id would
    # collide their machine ids and the gateway would orphan the duplicates.
    # Trade-off: no device token / HTTP cache persists across recreation, and
    # devices show up under opaque container hostnames rather than worker-1/2/3.
    deploy:
      replicas: 3
    environment:
      # Empty default (not :?) so `down`, `logs`, and `ps` work without a key.
      MEERKLY_API_KEY: ${MEERKLY_API_KEY:-}
      # Full proxy URL; a literal <sid> is replaced with a per-worker session id.
      PROXY_URL: ${PROXY_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-}
      GATEWAY_URL: ${GATEWAY_URL:-}
      ACCOUNT_BASE_URL: ${ACCOUNT_BASE_URL:-}
      ALLOW_INSECURE_GATEWAY: ${ALLOW_INSECURE_GATEWAY:-}
    # Needed on Linux so the container can reach a gateway on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 2gb
    # An in-flight crawl has a 30s budget; Docker's default 10s SIGKILL would
    # cut it off mid-job.
    stop_grace_period: 45s
    healthcheck:
      # /readyz here (is it actually serving?) vs /healthz in the image (is it
      # alive?).
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9090/readyz', timeout=4).status==200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
