[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meerkly-worker"
version = "1.0.0"
description = "Meerkly server worker (invisible_playwright / Firefox)"
requires-python = ">=3.11"
dependencies = [
    "invisible-playwright==0.6.0",
    "websockets>=13,<16",
    "httpx>=0.27,<1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4.21", "ruff>=0.6"]

[project.scripts]
meerkly-worker = "meerkly_worker.cli:main"

[tool.setuptools.packages.find]
include = ["meerkly_worker*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ holds design/plan markdown with illustrative Python fences for later
# tasks; ruff format-checks embedded code blocks in Markdown by default, but
# reformatting design docs is out of scope for source linting.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
