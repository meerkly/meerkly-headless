name: Deploy

# Every push to main publishes the worker image to ghcr, gated on the full CI
# suite so a broken commit never ships.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reuse the CI workflow as the gate — lint, tests, shellcheck — no duplication.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # QEMU lets the amd64 runner also build the arm64 image (Apple Silicon,
      # arm64 servers), so the pushed manifest serves both.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Short commit sha (traceable) + latest (what install.sh pulls).
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Multi-arch manifest: amd64 (most VPS/servers) + arm64 (Apple
          # Silicon, Ampere/Graviton). arm64 builds under QEMU emulation, so
          # this job is slower than a single-arch build.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# NOTE (one-time, manual): GitHub creates the ghcr package **private** on first
# push, so anonymous `docker pull` (what install.sh does) stays unauthorized
# until you flip it: GitHub → Packages → meerkly-headless → Package settings →
# Change visibility → Public. GITHUB_TOKEN cannot change package visibility, so
# this can't be automated here.
