name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Serialize builds so two CI runs finishing close together push the :latest tag
# in trigger order rather than racing.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  docker-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag with the TRIGGERING CI run's commit (the code checked out above),
      # not GITHUB_SHA -- for workflow_run events those diverge when two pushes
      # land quickly, and the installer/consumers would chase a tag that was
      # never pushed.
      - name: Compute image tag
        id: tag
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.short }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# No kubectl rollout job here (unlike api-gateway): the headless worker is not a
# cluster workload. This publishes ghcr.io/meerkly/meerkly-headless:latest, which
# `install.sh` pulls onto each operator's own machine. NOTE: the ghcr package
# must be set to public visibility once, or anonymous `docker pull` fails.
