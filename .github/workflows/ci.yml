name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Shellcheck the installer
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck install.sh
          sh -n install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The Python suite runs conformance against api-gateway/spec and refuses
      # to skip if it is missing. Check the sibling repo out beside nothing and
      # point SPEC_DIR at it. api-gateway is private, so GITHUB_TOKEN cannot
      # read it cross-repo -- provide a read-scoped PAT as the CI_PAT secret
      # (falls back to github.token, which works only if api-gateway is public).
      - name: Checkout api-gateway spec
        uses: actions/checkout@v6
        with:
          repository: meerkly/api-gateway
          path: api-gateway
          token: ${{ secrets.CI_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q
        env:
          SPEC_DIR: ${{ github.workspace }}/api-gateway/spec
