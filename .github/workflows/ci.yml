name: CI

on:
  pull_request:
  # Callable by the Deploy workflow, which gates publishing on these checks so a
  # push to main is tested and published in one pipeline (no duplicate run).
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Shellcheck the scripts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck install.sh scripts/sync-spec.sh
          sh -n install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e '.[dev]'

      # Conformance runs against the vendored spec/ (a copy of api-gateway/spec).
      # It is private, so CI can't check it out; keep the copy fresh locally with
      # scripts/sync-spec.sh, where tests prefer the real sibling checkout.
      - name: Run tests
        run: pytest -q
